<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Overworld</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* Dimension switcher */
        #dimensions {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 2px;
            padding: 3px;
            border-radius: 10px;
            background: rgba(20, 20, 24, 0.82);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #dimensions button {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #d6d6dc;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s, color 0.15s;
        }

        #dimensions button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        #dimensions button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 1px;
        }

        #dimensions button[aria-pressed="true"] {
            background: var(--accent);
            color: #fff;
        }

        #dimensions .dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: var(--accent);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
        }

        #dimensions button[aria-pressed="true"] .dot {
            background: #fff;
        }

        [data-dim="overworld"] { --accent: #3f8a3a; }
        [data-dim="nether"]    { --accent: #a3302a; }
        [data-dim="end"]       { --accent: #6b4fa8; }
        #measure-toggle        { --accent: #b7791f; }
        #structures-toggle     { --accent: #2f6fb3; }
        #stats-toggle          { --accent: #2f8a7e; }
        #biomes-toggle         { --accent: #5d8f2c; }

        /* Dimension statistics */
        #stats {
            top: 48px;
            right: 58px; /* left of the tool bar */
            width: 280px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        #stats .tabs {
            display: flex;
            gap: 2px;
            margin: 6px 0 4px;
            padding: 2px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.06);
        }

        #stats .tabs button {
            flex: 1;
            padding: 4px 6px;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: #d6d6dc;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        #stats .tabs button:hover { color: #fff; }
        #stats .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }

        #stats .tabs button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 1px;
        }

        #stats h3 {
            margin: 10px 0 2px;
            color: #9a9aa4;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #stats dl {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1px 10px;
            margin: 0;
            font-variant-numeric: tabular-nums;
        }

        #stats dt {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #9a9aa4;
        }

        #stats dd { margin: 0; text-align: right; color: #fff; }
        #stats .type-icon { width: 16px; height: 16px; font-size: 9px; }

        /* Tool bar (right edge, below uNmINeD's coordinate display) */
        #tools {
            position: absolute;
            top: 48px;
            right: 8px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 3px;
            border-radius: 10px;
            background: rgba(20, 20, 24, 0.82);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #tools button {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #d6d6dc;
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s;
        }

        #tools button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        #tools button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 1px;
        }

        #tools button[aria-pressed="true"] {
            background: var(--accent);
            color: #fff;
        }

        #tools button[hidden] { display: none; }

        #tools svg {
            width: 18px;
            height: 18px;
        }

        /* Shared look for the floating panels */
        .panel {
            position: absolute;
            z-index: 10;
            box-sizing: border-box;
            max-width: calc(100vw - 32px);
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(20, 20, 24, 0.9);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            color: #d6d6dc;
            font-size: 13px;
            line-height: 1.5;
        }

        .panel[hidden] { display: none; }

        .panel h2 {
            margin: 0 0 4px;
            color: #fff;
            font-size: 15px;
        }

        .panel .muted { color: #9a9aa4; font-size: 12px; }

        .panel .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .panel .actions button {
            flex: 1;
            padding: 6px 10px;
            border: 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font: inherit;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .panel .actions button:hover { background: rgba(255, 255, 255, 0.18); }
        .panel .actions button[hidden] { display: none; }

        /* Structure legend */
        #structures {
            top: 48px;
            right: 58px; /* left of the tool bar */
            width: 220px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        #structures .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        #structures .panel-header h2 { margin: 0; }

        #structures-all {
            padding: 3px 8px;
            border: 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        #structures-all:hover { background: rgba(255, 255, 255, 0.18); }

        #structures-all:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 1px;
        }

        #structures-all[hidden] { display: none; }

        #structures label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            cursor: pointer;
        }

        #structures label .count {
            margin-left: auto;
            color: #9a9aa4;
            font-variant-numeric: tabular-nums;
        }

        #structures input { margin: 0; accent-color: #2f6fb3; }

        .type-icon {
            display: inline-grid;
            place-items: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #1b1b20;
            box-shadow: 0 0 0 2px var(--type-color, #888);
            font-size: 11px;
            line-height: 1;
            flex: none;
        }

        /* Biome legend (shown with the biome map) */
        #biomes {
            top: 48px;
            right: 58px; /* left of the tool bar */
            width: 240px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        #biomes h2 { margin: 0; }

        #biomes .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        #biomes-all {
            padding: 3px 8px;
            border: 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        #biomes-all:hover { background: rgba(255, 255, 255, 0.18); }
        #biomes-all:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
        #biomes-all[hidden] { display: none; }
        #biomes:has(#biomes-body[hidden]) #biomes-all { display: none; }

        #biomes input { margin: 0; accent-color: #5d8f2c; flex: none; }

        #biomes h3 label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        #biomes label.biome { cursor: pointer; }
        #biomes .biome.off { color: #7c7c86; }
        #biomes .biome.off .swatch { opacity: 0.35; }

        #biomes-collapse {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        #biomes-collapse:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
            border-radius: 4px;
        }

        #biomes .chevron {
            width: 7px;
            height: 7px;
            margin-right: 3px;
            border-right: 2px solid #9a9aa4;
            border-bottom: 2px solid #9a9aa4;
            transform: translateY(-2px) rotate(45deg);
            transition: transform 0.15s;
        }

        #biomes-collapse[aria-expanded="false"] .chevron { transform: translateY(1px) rotate(-135deg); }
        #biomes-body[hidden] { display: none; }
        #biomes:has(#biomes-body[hidden]) { width: auto; min-width: 140px; }

        #biomes h3 {
            margin: 10px 0 2px;
            color: #9a9aa4;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #biomes .biome {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 1px 0;
        }

        #biomes .biome .share {
            margin-left: auto;
            padding-left: 6px;
            white-space: nowrap;
            color: #9a9aa4;
            font-variant-numeric: tabular-nums;
        }

        #biomes .biome.active {
            margin: 0 -6px;
            padding: 1px 6px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }

        /* Biome under the cursor */
        #biome-tip {
            position: fixed;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 4px 9px;
            border-radius: 7px;
            background: rgba(20, 20, 24, 0.92);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            pointer-events: none;
        }

        #biome-tip[hidden] { display: none; }

        #biome-tip .swatch,
        #biomes .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            background: var(--biome-color);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
            flex: none;
        }

        /* Structure details */
        #info {
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 240px;
        }

        #info h2 {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #info .coords { font-variant-numeric: tabular-nums; }

        /* Search: coordinates, structures, biomes */
        #search {
            top: 64px;
            left: 8px;
            width: 340px;
            padding: 8px;
        }

        #search-input {
            box-sizing: border-box;
            width: 100%;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font: inherit;
            font-size: 14px;
            outline: none;
        }

        #search-input:focus { border-color: #fff; }
        #search-input::placeholder { color: #8a8a94; }

        #search-origin { margin: 6px 2px 2px; }

        #search-origin .link {
            padding: 0;
            border: 0;
            background: none;
            color: #b9adff;
            font: inherit;
            text-decoration: underline;
            cursor: pointer;
        }

        #search-origin .link:hover { color: #fff; }

        #search-results {
            margin: 4px 0 0;
            padding: 0;
            list-style: none;
            max-height: min(420px, calc(100vh - 200px));
            overflow-y: auto;
        }

        #search-results li {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 6px 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        #search-results li[aria-selected="true"] { background: rgba(255, 255, 255, 0.14); }
        #search-results li.note { cursor: default; color: #9a9aa4; }
        #search-results .text { min-width: 0; flex: 1; }
        #search-results .title { color: #fff; font-weight: 600; }
        #search-results .detail { color: #9a9aa4; font-size: 12px; font-variant-numeric: tabular-nums; }
        #search-results .dim-tag { color: #c8b6ff; }

        #search-results .result-icon {
            display: inline-grid;
            place-items: center;
            width: 20px;
            height: 20px;
            flex: none;
            color: #fff;
            font-size: 14px;
        }

        #search-results .swatch {
            width: 16px;
            height: 16px;
            margin: 0 2px;
            border-radius: 3px;
            background: var(--biome-color);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
            flex: none;
        }

        #search-results .action {
            padding: 3px 7px;
            border: 0;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: none;
        }

        #search-results .action:hover { background: rgba(255, 255, 255, 0.2); }

        #search-toggle { --accent: #6a5acd; }
        #slime-toggle  { --accent: #4e9a3c; }
        #caves-toggle  { --accent: #8a6d3b; }

        /* Short notice at the bottom, e.g. "zoom in to see slime chunks" */
        #map-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(20, 20, 24, 0.88);
            color: #d6d6dc;
            font-size: 13px;
            pointer-events: none;
        }

        #map-hint[hidden] { display: none; }

        /* Marks the map centre ("from here") while the search is open */
        #search-crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 5;
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px;
            pointer-events: none;
            background:
                linear-gradient(#fff, #fff) center / 2px 100% no-repeat,
                linear-gradient(#fff, #fff) center / 100% 2px no-repeat;
            filter: drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.9));
            opacity: 0.85;
        }

        #search-crosshair[hidden] { display: none; }

        /* Measurement result */
        #measure {
            position: absolute;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            min-width: 230px;
            max-width: calc(100vw - 32px);
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(20, 20, 24, 0.88);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            color: #d6d6dc;
            font-size: 13px;
            line-height: 1.5;
        }

        #measure[hidden] { display: none; }

        #measure .total {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        #measure dl {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0 10px;
            margin: 4px 0 0;
            font-variant-numeric: tabular-nums;
        }

        #measure dt { color: #9a9aa4; }
        #measure dd { margin: 0; text-align: right; }

        #measure .hint {
            margin-top: 6px;
            color: #9a9aa4;
            font-size: 12px;
        }

        #measure .actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        #measure .actions button {
            flex: 1;
            padding: 6px 10px;
            border: 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        #measure .actions button:hover { background: rgba(255, 255, 255, 0.18); }
        #measure .actions button[hidden] { display: none; }

        @media (max-width: 480px) {
            #dimensions {
                top: auto;
                bottom: 40px;
            }

            #dimensions button {
                padding: 7px 10px;
                font-size: 13px;
            }

            #measure {
                top: auto;
                bottom: 92px;
            }

            #structures {
                width: min(220px, calc(100vw - 74px));
                max-height: calc(100vh - 200px);
            }

            #stats {
                width: min(280px, calc(100vw - 74px));
                max-height: calc(100vh - 200px);
            }

            #biomes {
                width: min(240px, calc(100vw - 74px));
                max-height: calc(100vh - 200px);
            }

            #search {
                width: calc(100vw - 74px);
            }

            #info {
                bottom: 92px;
                width: calc(100vw - 32px);
            }
        }
    </style>
</head>

<body>
    <nav id="dimensions" aria-label="Dimension">
        <button type="button" data-dim="overworld" title="Overworld (key 1)"><span class="dot"></span>Overworld</button>
        <button type="button" data-dim="nether" title="Nether (key 2)"><span class="dot"></span>Nether</button>
        <button type="button" data-dim="end" title="The End (key 3)"><span class="dot"></span>The End</button>
    </nav>

    <div id="tools" role="toolbar" aria-label="Tools" aria-orientation="vertical">
        <button type="button" id="search-toggle" aria-pressed="false" aria-controls="search"
            aria-label="Search" title="Search coordinates, structures, biomes (key F or /)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <circle cx="6.8" cy="6.8" r="4.6" />
                <path d="M10.3 10.3l4.2 4.2" stroke-linecap="round" />
            </svg>
        </button>
        <button type="button" id="structures-toggle" aria-pressed="false" aria-controls="structures"
            aria-label="Structures" title="Structures (key S)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M8 14.5s-4.5-4.2-4.5-7.6a4.5 4.5 0 0 1 9 0c0 3.4-4.5 7.6-4.5 7.6z" />
                <circle cx="8" cy="6.8" r="1.6" />
            </svg>
        </button>
        <button type="button" id="stats-toggle" aria-pressed="false" aria-controls="stats"
            aria-label="Statistics" title="Statistics (key I)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M2 14.5h12" />
                <path d="M4 12V8M8 12V3.5M12 12V6" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>
        <button type="button" id="biomes-toggle" aria-pressed="false" aria-controls="biomes"
            aria-label="Biome map" title="Biome map (key B)" hidden>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M2.5 13.5c0-6.5 4.5-11 11-11 0 6.5-4.5 11-11 11z" />
                <path d="M2.5 13.5l6-6" stroke-linecap="round" />
            </svg>
        </button>
        <button type="button" id="caves-toggle" aria-pressed="false" hidden
            aria-label="Cave map" title="Cave map, Overworld (key C)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M1.5 13.5h13" stroke-linecap="round" />
                <path d="M2.5 13.5c0-5 2.4-9 5.5-9s5.5 4 5.5 9" />
                <path d="M6 13.5c0-2.2.9-4 2-4s2 1.8 2 4" />
            </svg>
        </button>
        <button type="button" id="slime-toggle" aria-pressed="false" hidden
            aria-label="Slime chunks" title="Slime chunks (key K, Overworld)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <rect x="2.5" y="3.5" width="11" height="10" rx="2.5" />
                <path d="M5.5 7.5v1.2M10.5 7.5v1.2M6.5 11h3" stroke-linecap="round" />
            </svg>
        </button>
        <button type="button" id="measure-toggle" aria-pressed="false"
            aria-label="Measure distance" title="Measure distance (key M)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M1.5 11.5l10-10 3 3-10 10z" />
                <path d="M4.5 8.5l1.5 1.5M6.5 6.5l1 1M8.5 4.5l1.5 1.5" />
            </svg>
        </button>
    </div>

    <section id="structures" class="panel" aria-label="Structures" hidden>
        <div class="panel-header">
            <h2>Structures</h2>
            <button type="button" id="structures-all" hidden></button>
        </div>
        <div id="structures-list"></div>
        <div class="muted" id="structures-meta" hidden></div>
    </section>

    <section id="stats" class="panel" aria-label="Statistics" hidden>
        <h2>Statistics</h2>
        <div class="tabs" role="tablist" aria-label="Dimension">
            <button type="button" role="tab" data-stats-dim="overworld" style="--accent: #3f8a3a">Overworld</button>
            <button type="button" role="tab" data-stats-dim="nether" style="--accent: #a3302a">Nether</button>
            <button type="button" role="tab" data-stats-dim="end" style="--accent: #6b4fa8">The End</button>
        </div>
        <div id="stats-body" role="tabpanel"></div>
    </section>

    <section id="biomes" class="panel" aria-label="Biomes" hidden>
        <div class="panel-header">
            <h2>
                <button type="button" id="biomes-collapse" aria-expanded="true" aria-controls="biomes-body"
                    title="Collapse or expand the list">
                    Biomes<span class="chevron" aria-hidden="true"></span>
                </button>
            </h2>
            <button type="button" id="biomes-all" hidden></button>
        </div>
        <div id="biomes-body">
            <div id="biomes-list"></div>
            <p class="muted" id="biomes-meta" hidden></p>
        </div>
    </section>

    <section id="search" class="panel" aria-label="Search" hidden>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false"
            placeholder="X Z, structure or biome" aria-label="Search coordinates, structures or biomes"
            aria-controls="search-results" aria-autocomplete="list">
        <div class="muted" id="search-origin"></div>
        <ul id="search-results" role="listbox" aria-label="Results"></ul>
    </section>
    <div id="search-crosshair" hidden></div>
    <div id="map-hint" role="status" hidden></div>

    <div id="biome-tip" role="status" hidden><span class="swatch"></span><span class="name"></span></div>

    <section id="info" class="panel" aria-live="polite" hidden>
        <h2><span class="type-icon" id="info-icon"></span><span id="info-title"></span></h2>
        <div class="coords" id="info-coords"></div>
        <div id="info-details"></div>
        <div class="actions">
            <button type="button" id="info-go"></button>
            <button type="button" id="info-tp">Copy /tp</button>
            <button type="button" id="info-wp" title="Copy this place as an entry for markers.json">Copy waypoint</button>
            <button type="button" id="info-close">Close</button>
        </div>
    </section>

    <section id="measure" aria-live="polite" hidden>
        <div class="total" id="measure-total">0 blocks</div>
        <dl id="measure-details"></dl>
        <div class="hint" id="measure-hint"></div>
        <div class="actions">
            <button type="button" id="measure-finish">Finish</button>
            <button type="button" id="measure-clear">Clear</button>
        </div>
    </section>

    <iframe id="frame" title="Map"></iframe>

    <script>
        // Each dimension is a separate uNmINeD export in its own folder under map/.
        // `scale` is blocks-per-block relative to the Overworld (Nether is 1:8).
        const DIMENSIONS = {
            overworld: { label: 'Overworld', path: 'map/overworld/index.html', scale: 1 },
            nether:    { label: 'Nether',    path: 'map/nether/index.html',    scale: 8 },
            end:       { label: 'The End',   path: 'map/end/index.html',       scale: null } // no coordinate link
        };
        const DEFAULT_DIM = 'overworld';

        // Zoom, in screen pixels per block. uNmINeD stops at 1 device pixel per
        // block (tiny on scaled/HiDPI displays); beyond zoom.0 the tiles are
        // upscaled without smoothing, so blocks stay crisp.
        const ZOOM = {
            maxPixelsPerBlock: 16,   // closest zoom (power of two)
            defaultPixelsPerBlock: 2 // initial zoom on first load
        };

        const frame = document.getElementById('frame');
        const buttons = document.querySelectorAll('#dimensions button[data-dim]');
        let current = null;
        let pendingView = null;

        // Access the uNmINeD instance inside the iframe. Works when served over
        // http(s); when opened via file:// browsers may block it, in which case
        // switching still works but the map position is not carried over.
        function getUnmined() {
            try {
                return frame.contentWindow.eval('typeof unmined !== "undefined" ? unmined : null');
            } catch (e) {
                return null;
            }
        }

        // View-projection units per block. Each export has its own projection,
        // so zoom is exchanged between dimensions as pixels per block.
        function blockUnit(u, ol) {
            return ol.proj.transform([1, 1], u.dataProjection, u.viewProjection)[0];
        }

        // Replace uNmINeD's view with one that ignores devicePixelRatio and
        // allows zooming past 1:1.
        function upgradeZoom() {
            const u = getUnmined();
            const ol = frame.contentWindow && frame.contentWindow.ol;
            if (!u || !u.olMap || !ol || u.mapRendererZoomUpgraded) return;
            try {
                const map = u.olMap;
                const tileLayer = map.getLayers().item(0);
                const oldView = map.getView();
                const unit = blockUnit(u, ol);
                const minZoom = frame.contentWindow.UnminedMapProperties.minZoom;
                const maxZoom = Math.log2(ZOOM.maxPixelsPerBlock);

                const resolutions = [];
                for (let z = minZoom; z <= maxZoom; z++) {
                    resolutions.push(unit / Math.pow(2, z));
                }

                map.setView(new ol.View({
                    center: oldView.getCenter(),
                    extent: tileLayer.getSource().getTileGrid().getExtent(),
                    projection: oldView.getProjection(),
                    resolutions: resolutions,
                    resolution: unit / ZOOM.defaultPixelsPerBlock,
                    constrainResolution: true,
                    showFullExtent: true,
                    constrainOnlyCenter: true,
                    enableRotation: false
                }));

                // OpenLayers sets smoothing right before this event; turn it off
                // so upscaled tiles render as sharp pixels.
                tileLayer.on('prerender', e => { e.context.imageSmoothingEnabled = false; });

                u.mapRendererZoomUpgraded = true;
            } catch (e) {
                console.warn('Zoom upgrade failed', e);
            }
        }

        // Last view per dimension for this browser session: switching back
        // returns to where you were, also after a reload of the tab.
        const VIEWS_KEY = 'map-renderer.views';
        let savedViews = {};
        try { savedViews = JSON.parse(sessionStorage.getItem(VIEWS_KEY)) || {}; } catch (e) { /* ignore */ }

        function rememberView(dim, v) {
            if (!DIMENSIONS[dim] || !v || !isFinite(v.x) || !isFinite(v.z) || !(v.ppb > 0)) return;
            savedViews[dim] = { x: Math.round(v.x), z: Math.round(v.z), ppb: v.ppb };
            try { sessionStorage.setItem(VIEWS_KEY, JSON.stringify(savedViews)); } catch (e) { /* ignore */ }
        }

        // Defaults read the map currently in the iframe; pass u/ol to read a specific one.
        function readView(u = getUnmined(), ol = frame.contentWindow && frame.contentWindow.ol) {
            if (!u || !u.olMap || !ol) return null;
            try {
                const view = u.olMap.getView();
                const block = ol.proj.transform(view.getCenter(), u.viewProjection, u.dataProjection);
                return { x: block[0], z: block[1], ppb: blockUnit(u, ol) / view.getResolution() };
            } catch (e) {
                return null;
            }
        }

        function applyView(v) {
            const u = getUnmined();
            if (!u || !u.olMap || !v) return;
            try {
                const ol = frame.contentWindow.ol;
                u.center([v.x, v.z]);
                if (v.ppb) u.olMap.getView().setResolution(blockUnit(u, ol) / v.ppb);
            } catch (e) { /* ignore */ }
        }

        // ---- Biome maps ------------------------------------------------------
        // map-renderer --biomes renders map/<dim>-biomes/ next to the normal
        // export (same projection) and writes the legend to map/biomes.json.

        const BIOME_MODE_KEY = 'map-renderer.biome-mode';
        const biomesToggle = document.getElementById('biomes-toggle');
        const biomesPanel = document.getElementById('biomes');
        const biomesList = document.getElementById('biomes-list');
        const biomesMeta = document.getElementById('biomes-meta');

        let biomeDoc = null; // parsed biomes.json: { edition, dimensions: { overworld: [...], ... } }
        let biomeMode = false;
        try { biomeMode = localStorage.getItem(BIOME_MODE_KEY) === '1'; } catch (e) { /* ignore */ }

        const hasBiomeMap = dim => Boolean(biomeDoc && biomeDoc.dimensions && biomeDoc.dimensions[dim]);

        // ---- Cave map --------------------------------------------------------
        // map-renderer --caves renders map/overworld-caves/: the Overworld with
        // everything above a fixed height left out (caves, ancient cities, deep
        // dark). map/caves.json says which dimensions have one and from which y.
        // Biome map and cave map are alternatives; switching one on switches the
        // other off.

        const CAVE_MODE_KEY = 'map-renderer.cave-mode';
        const cavesToggle = document.getElementById('caves-toggle');
        let caveDoc = null;
        let caveMode = false;
        try { caveMode = localStorage.getItem(CAVE_MODE_KEY) === '1'; } catch (e) { /* ignore */ }
        const hasCaveMap = dim => Boolean(caveDoc && caveDoc.dimensions && caveDoc.dimensions[dim]);

        function mapPath(dim) {
            if (caveMode && hasCaveMap(dim)) return 'map/' + dim + '-caves/index.html';
            if (biomeMode && hasBiomeMap(dim)) return 'map/' + dim + '-biomes/index.html';
            return DIMENSIONS[dim].path;
        }

        const cavesLoaded = fetch('map/caves.json', { cache: 'no-cache' })
            .then(r => (r.ok ? r.json() : null))
            .catch(() => null)
            .then(doc => {
                caveDoc = doc && doc.dimensions && Object.keys(doc.dimensions).length ? doc : null;
                updateCaveUi();
                if (current && frame.getAttribute('src') !== mapPath(current)) reloadMap();
            });

        function updateCaveUi() {
            cavesToggle.hidden = !hasCaveMap(current); // only where a cave map exists
            const shown = caveMode && hasCaveMap(current);
            cavesToggle.setAttribute('aria-pressed', String(caveMode && !!caveDoc));
            const top = caveDoc && caveDoc.dimensions.overworld && caveDoc.dimensions.overworld.topY;
            cavesToggle.title = 'Cave map' + (top !== undefined ? ' (y = ' + top + ' and below)' : '')
                + ', Overworld (key C)';
            updateMapHint(shown ? 'Cave map: y = ' + caveDoc.dimensions[current].topY + ' and below' : null);
        }

        function setCaveMode(on) {
            caveMode = on;
            try { localStorage.setItem(CAVE_MODE_KEY, on ? '1' : '0'); } catch (e) { /* ignore */ }
            if (on && biomeMode) {
                // The biome map is the other alternative: off, without loading it first.
                biomeMode = false;
                try { localStorage.setItem(BIOME_MODE_KEY, '0'); } catch (e) { /* ignore */ }
                biomesToggle.setAttribute('aria-pressed', 'false');
                hideBiomeTip();
                setBiomesPanel(false);
            }
            updateCaveUi();
            if (current && frame.getAttribute('src') !== mapPath(current)) reloadMap();
        }

        cavesToggle.addEventListener('click', () => setCaveMode(!caveMode));

        const biomesLoaded = fetch('map/biomes.json', { cache: 'no-cache' })
            .then(r => (r.ok ? r.json() : null))
            .catch(() => null)
            .then(doc => {
                biomeDoc = doc && doc.dimensions && Object.keys(doc.dimensions).length ? doc : null;
                biomesToggle.hidden = !biomeDoc;
                biomesToggle.setAttribute('aria-pressed', String(biomeMode && !!biomeDoc));
                if (current && frame.getAttribute('src') !== mapPath(current)) reloadMap();
            });

        // Load the other export of the current dimension at the same position.
        function reloadMap() {
            const v = readView();
            if (v) {
                rememberView(current, v);
                pendingView = v;
            }
            measureReset();
            structuresReset();
            hideBiomeTip();
            frame.src = mapPath(current);
        }

        // Biomes switched off in the legend are dimmed on the map, so the ones
        // still selected stand out (needs the lookup data: Bedrock worlds).
        const HIDDEN_BIOMES_KEY = 'map-renderer.hidden-biomes';
        const biomesAll = document.getElementById('biomes-all');
        let hiddenBiomes = new Set();
        try { hiddenBiomes = new Set(JSON.parse(localStorage.getItem(HIDDEN_BIOMES_KEY)) || []); } catch (e) { /* ignore */ }

        function setBiomesHidden(ids, hidden) {
            for (const id of ids) {
                if (hidden) hiddenBiomes.add(id); else hiddenBiomes.delete(id);
            }
            try { localStorage.setItem(HIDDEN_BIOMES_KEY, JSON.stringify([...hiddenBiomes])); } catch (e) { /* ignore */ }
            refreshBiomeMask();
            const scroll = biomesPanel.scrollTop;
            renderBiomeLegend();
            biomesPanel.scrollTop = scroll;
        }

        function checkbox(checked, indeterminate, onChange) {
            const box = document.createElement('input');
            box.type = 'checkbox';
            box.checked = checked;
            box.indeterminate = indeterminate;
            box.addEventListener('change', () => onChange(box.checked));
            return box;
        }

        function renderBiomeLegend() {
            if (biomesPanel.hidden) return;
            const entries = hasBiomeMap(current) ? biomeDoc.dimensions[current] : [];
            const selectable = Boolean(biomeDoc && biomeDoc.lookup && biomeDoc.lookup[current]);
            const parts = [];
            const groups = new Map(); // group -> ids
            for (const b of entries) {
                if (!groups.has(b.group)) groups.set(b.group, []);
                groups.get(b.group).push(b.id);
            }

            let group = null;
            for (const b of entries) {
                if (b.group !== group) {
                    group = b.group;
                    const h = document.createElement('h3');
                    const ids = groups.get(group);
                    if (selectable && ids.length > 1) {
                        const off = ids.filter(id => hiddenBiomes.has(id)).length;
                        const label = document.createElement('label');
                        label.title = 'Show or hide all ' + group + ' biomes';
                        label.append(checkbox(off === 0, off > 0 && off < ids.length,
                            on => setBiomesHidden(ids, !on)), document.createTextNode(group));
                        h.append(label);
                    } else {
                        h.textContent = group;
                    }
                    parts.push(h);
                }
                const off = selectable && hiddenBiomes.has(b.id);
                const row = document.createElement(selectable ? 'label' : 'div');
                row.className = 'biome' + (off ? ' off' : '');
                if (b.value) row.dataset.value = b.value;
                const swatch = document.createElement('span');
                swatch.className = 'swatch';
                swatch.style.setProperty('--biome-color', b.color);
                const name = document.createElement('span');
                name.textContent = b.name;
                row.title = b.id;
                if (selectable) row.append(checkbox(!off, false, on => setBiomesHidden([b.id], !on)));
                row.append(swatch, name);
                if (b.share !== undefined) {
                    const share = document.createElement('span');
                    share.className = 'share';
                    share.textContent = b.share >= 0.001
                        ? (b.share * 100).toLocaleString(undefined, { maximumFractionDigits: 1 }) + ' %'
                        : '< 0.1 %';
                    share.title = 'Share of the explored area';
                    row.append(share);
                }
                parts.push(row);
            }
            biomesList.replaceChildren(...parts);
            highlightBiome(activeBiomeValue);

            // "Hide all" / "Show all" for the biomes of this dimension.
            const ids = entries.map(b => b.id);
            const allVisible = ids.every(id => !hiddenBiomes.has(id));
            biomesAll.hidden = !selectable || ids.length === 0;
            biomesAll.textContent = allVisible ? 'Hide all' : 'Show all';
            biomesAll.title = allVisible
                ? 'Dim all biomes, then tick the ones to find'
                : 'Show all biomes again';
            biomesAll.onclick = () => setBiomesHidden(ids, allVisible);

            biomesMeta.hidden = entries.length > 0;
            biomesMeta.textContent = current === 'end'
                ? 'The End is a single biome; there is no biome map for it.'
                : 'No biome map for this dimension yet. Run: map-renderer render --biomes';
        }

        // ---- Biome under the cursor (hover, or click/tap) --------------------
        // map-renderer reads the surface biomes from Bedrock worlds into
        // map/biomedata/<dim>/r.<rx>.<rz>.bin: zlib, one byte per 4x4 block
        // cell (128x128 per region), byte = Bedrock biome number + 1, 0 = none.

        const biomeTip = document.getElementById('biome-tip');
        const biomeTipSwatch = biomeTip.querySelector('.swatch');
        const biomeTipName = biomeTip.querySelector('.name');
        const biomeRegions = new Map(); // "dim:rx:rz" -> Promise<Uint8Array|null>
        let activeBiomeValue = 0;
        let biomeTipToken = 0;

        const hasBiomeLookup = dim => Boolean(biomeMode && biomeDoc && biomeDoc.lookup && biomeDoc.lookup[dim]
            && typeof DecompressionStream === 'function');

        const biomeIndexes = new Map(); // dim -> Promise<{ regions: Set, overview } | null>

        const lookupUrl = (dim, file) => 'map/' + biomeDoc.lookup[dim] + '/' + file + '?v='
            + encodeURIComponent(biomeDoc.generated || '');

        function fetchInflated(url) {
            return fetch(url)
                .then(r => (r.ok ? new Response(r.body.pipeThrough(new DecompressionStream('deflate'))).arrayBuffer() : null))
                .then(buf => (buf ? new Uint8Array(buf) : null))
                .catch(() => null);
        }

        // index.json: which regions exist (no requests for unexplored ones) and the overview's bounds.
        function biomeIndex(dim) {
            if (!biomeIndexes.has(dim)) {
                biomeIndexes.set(dim, fetch(lookupUrl(dim, 'index.json'))
                    .then(r => (r.ok ? r.json() : null))
                    .then(index => index && {
                        regions: new Set((index.regions || []).map(([rx, rz]) => rx + ':' + rz)),
                        overview: index.overview ? {
                            size: index.overview.size,     // blocks per overview tile
                            pixels: index.overview.pixels, // bytes per tile side (1 per chunk)
                            tiles: new Set(index.overview.tiles.map(([gx, gz]) => gx + ':' + gz))
                        } : null
                    })
                    .catch(() => null));
            }
            return biomeIndexes.get(dim);
        }

        function biomeRegion(dim, rx, rz) {
            const key = dim + ':' + rx + ':' + rz;
            if (!biomeRegions.has(key)) {
                biomeRegions.set(key, biomeIndex(dim).then(index =>
                    (index && !index.regions.has(rx + ':' + rz)
                        ? null
                        : fetchInflated(lookupUrl(dim, 'r.' + rx + '.' + rz + '.bin')))));
            }
            return biomeRegions.get(key);
        }

        function biomeOverview(dim, gx, gz) {
            const key = dim + ':o:' + gx + ':' + gz;
            if (!biomeRegions.has(key)) {
                biomeRegions.set(key, biomeIndex(dim).then(index =>
                    (index && index.overview && index.overview.tiles.has(gx + ':' + gz)
                        ? fetchInflated(lookupUrl(dim, 'o.' + gx + '.' + gz + '.bin'))
                        : null)));
            }
            return biomeRegions.get(key);
        }

        async function biomeAt(dim, x, z) {
            const size = biomeDoc.lookupRegion || 512;
            const cell = biomeDoc.lookupCell || 4;
            const rx = Math.floor(x / size);
            const rz = Math.floor(z / size);
            const data = await biomeRegion(dim, rx, rz);
            if (!data) return null;
            const perRow = size / cell;
            const value = data[Math.floor((z - rz * size) / cell) * perRow + Math.floor((x - rx * size) / cell)];
            if (!value) return null;
            return (biomeDoc.dimensions[dim] || []).find(b => b.value === value) || null;
        }

        function highlightBiome(value) {
            activeBiomeValue = value || 0;
            biomesList.querySelectorAll('.biome.active').forEach(r => r.classList.remove('active'));
            if (activeBiomeValue) {
                const row = biomesList.querySelector('.biome[data-value="' + activeBiomeValue + '"]');
                if (row) row.classList.add('active');
            }
        }

        function hideBiomeTip() {
            biomeTipToken++;
            biomeTip.hidden = true;
            highlightBiome(0);
        }

        // Show the biome at a map pixel. Lookups are async, so a newer request
        // (token) wins over answers that arrive late.
        async function showBiomeAt(u, ol, pixel) {
            const token = ++biomeTipToken;
            if (!hasBiomeLookup(current) || measureActive) {
                hideBiomeTip();
                return;
            }
            const block = ol.proj.transform(u.olMap.getCoordinateFromPixel(pixel), u.viewProjection, u.dataProjection);
            const b = await biomeAt(current, Math.floor(block[0]), Math.floor(block[1]));
            if (token !== biomeTipToken) return;
            if (!b) {
                biomeTip.hidden = true;
                highlightBiome(0);
                return;
            }
            biomeTipSwatch.style.setProperty('--biome-color', b.color);
            biomeTipName.textContent = b.name;
            const rect = frame.getBoundingClientRect();
            biomeTip.hidden = false;
            // Below right of the cursor, kept inside the window.
            const left = Math.min(rect.left + pixel[0] + 14, window.innerWidth - biomeTip.offsetWidth - 8);
            const top = Math.min(rect.top + pixel[1] + 18, window.innerHeight - biomeTip.offsetHeight - 8);
            biomeTip.style.left = Math.max(8, left) + 'px';
            biomeTip.style.top = Math.max(8, top) + 'px';
            highlightBiome(b.value);
        }

        function attachBiomeHover() {
            const u = getUnmined();
            const ol = frame.contentWindow && frame.contentWindow.ol;
            if (!u || !u.olMap || !ol) return;
            const view = frame.contentWindow;
            let pending = null;
            u.olMap.on('pointermove', e => {
                if (e.dragging) {
                    hideBiomeTip();
                    return;
                }
                if (!hasBiomeLookup(current)) return;
                if (pending === null) {
                    view.requestAnimationFrame(() => {
                        const pixel = pending;
                        pending = null;
                        showBiomeAt(u, ol, pixel);
                    });
                }
                pending = e.pixel;
            });
            // Touch screens have no hover: a tap shows the biome there.
            u.olMap.on('singleclick', e => {
                if (hasBiomeLookup(current)) showBiomeAt(u, ol, e.pixel);
            });
            u.olMap.getViewport().addEventListener('mouseleave', hideBiomeTip);
        }

        // ---- Dimming hidden biomes on the map --------------------------------
        // An image layer above the biome tiles. Per region, a mask with one
        // pixel per 4x4 cell (dark where the biome is hidden) is built once
        // from the lookup data and drawn scaled into place.

        const BIOME_DIM = [14, 14, 18, 225]; // RGBA over hidden biomes
        const OVERVIEW_BLOCKS_PER_PIXEL = 8; // zoomed out further: one overview image instead of regions
        let biomeMask = null;                // { layer, source, masks } of the loaded biome map

        // Canvas (one pixel per value) that is dark where the biome is hidden.
        // Cells without biome data (0) are dimmed too: only the selection stays bright.
        function maskCanvas(doc, data, width, height, dim) {
            const hidden = new Set(biomeDoc.dimensions[dim].filter(b => hiddenBiomes.has(b.id)).map(b => b.value));
            hidden.add(0);
            const canvas = doc.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const g = canvas.getContext('2d');
            const img = g.createImageData(width, height);
            for (let i = 0; i < data.length; i++) {
                if (hidden.has(data[i])) img.data.set(BIOME_DIM, i * 4);
            }
            g.putImageData(img, 0, 0);
            return canvas;
        }

        function refreshBiomeMask() {
            if (!biomeMask) return;
            biomeMask.masks.clear();
            biomeMask.layer.setVisible(hiddenBiomes.size > 0);
            biomeMask.source.changed();
        }

        function attachBiomeMask() {
            biomeMask = null;
            if (!hasBiomeLookup(current)) return;
            const u = getUnmined();
            const ol = frame.contentWindow && frame.contentWindow.ol;
            if (!u || !u.olMap || !ol) return;

            const dim = current;
            const doc = u.olMap.getTargetElement().ownerDocument;
            const size = biomeDoc.lookupRegion || 512;
            const cells = size / (biomeDoc.lookupCell || 4);
            const masks = new Map(); // "rx:rz" -> canvas | null (no data) | 'loading'
            const toBlock = c => ol.proj.transform(c, u.viewProjection, u.dataProjection);
            const toView = b => ol.proj.transform(b, u.dataProjection, u.viewProjection);
            let redraw = 0;
            let source = null;

            const scheduleRedraw = () => {
                if (!redraw) redraw = doc.defaultView.requestAnimationFrame(() => { redraw = 0; source.changed(); });
            };

            // Mask for a region ("rx:rz") or the overview ("overview"); built
            // asynchronously, the layer redraws when it is ready.
            function mask(key, load, width, height) {
                if (masks.has(key)) return masks.get(key);
                masks.set(key, 'loading');
                load().then(data => {
                    if (masks.get(key) !== 'loading') return; // cleared meanwhile; requested again on redraw
                    masks.set(key, data ? maskCanvas(doc, data, width, height, dim) : null);
                    if (data) scheduleRedraw();
                });
                return 'loading';
            }

            // Draw `image` so that its corners land on blocks (bx0, bz0) and (bx1, bz1).
            function place(g, image, extent, sx, sy, bx0, bz0, bx1, bz1) {
                const p0 = toView([bx0, bz0]);
                const p1 = toView([bx1, bz1]);
                const x0 = (p0[0] - extent[0]) * sx, y0 = (extent[3] - p0[1]) * sy;
                const x1 = (p1[0] - extent[0]) * sx, y1 = (extent[3] - p1[1]) * sy;
                g.setTransform((x1 - x0) / image.width, 0, 0, (y1 - y0) / image.height, x0, y0);
                g.drawImage(image, 0, 0);
            }

            let index = null;
            biomeIndex(dim).then(i => {
                index = i;
                scheduleRedraw();
            });

            source = new ol.source.ImageCanvas({
                interpolate: false,
                ratio: 1.2,
                canvasFunction: (extent, resolution, pixelRatio, imgSize) => {
                    const canvas = doc.createElement('canvas');
                    canvas.width = imgSize[0];
                    canvas.height = imgSize[1];
                    if (!hiddenBiomes.size || !index) return canvas;
                    const g = canvas.getContext('2d');
                    g.imageSmoothingEnabled = false;
                    const sx = imgSize[0] / (extent[2] - extent[0]);
                    const sy = imgSize[1] / (extent[3] - extent[1]);
                    const a = toBlock([extent[0], extent[1]]);
                    const b = toBlock([extent[2], extent[3]]);
                    const blocksPerPixel = Math.abs(b[0] - a[0]) / (imgSize[0] / pixelRatio);

                    // Far out: overview tiles (1 pixel per chunk); closer: region files (4x4 cells).
                    const ov = index.overview;
                    const overview = ov && blocksPerPixel >= OVERVIEW_BLOCKS_PER_PIXEL;
                    const step = overview ? ov.size : size;
                    const tiles = overview ? ov.tiles : index.regions;
                    const x0 = Math.floor(Math.min(a[0], b[0]) / step), x1 = Math.floor(Math.max(a[0], b[0]) / step);
                    const z0 = Math.floor(Math.min(a[1], b[1]) / step), z1 = Math.floor(Math.max(a[1], b[1]) / step);
                    for (let tx = x0; tx <= x1; tx++) {
                        for (let tz = z0; tz <= z1; tz++) {
                            if (!tiles.has(tx + ':' + tz)) continue;
                            const m = overview
                                ? mask('o:' + tx + ':' + tz, () => biomeOverview(dim, tx, tz), ov.pixels, ov.pixels)
                                : mask(tx + ':' + tz, () => biomeRegion(dim, tx, tz), cells, cells);
                            if (m && m !== 'loading') {
                                place(g, m, extent, sx, sy, tx * step, tz * step, (tx + 1) * step, (tz + 1) * step);
                            }
                        }
                    }
                    g.setTransform(1, 0, 0, 1, 0, 0);
                    return canvas;
                }
            });
            const layer = new ol.layer.Image({ source, zIndex: 1000, visible: hiddenBiomes.size > 0 });
            u.olMap.addLayer(layer);
            biomeMask = { layer, source, masks };
        }

        // The list can be collapsed to just the title while the biome map stays on.
        const BIOME_COLLAPSED_KEY = 'map-renderer.biome-legend-collapsed';
        const biomesCollapse = document.getElementById('biomes-collapse');
        const biomesBody = document.getElementById('biomes-body');

        function setBiomeListCollapsed(collapsed) {
            biomesBody.hidden = collapsed;
            biomesCollapse.setAttribute('aria-expanded', String(!collapsed));
            try { localStorage.setItem(BIOME_COLLAPSED_KEY, collapsed ? '1' : '0'); } catch (e) { /* ignore */ }
        }

        try { setBiomeListCollapsed(localStorage.getItem(BIOME_COLLAPSED_KEY) === '1'); } catch (e) { /* ignore */ }
        biomesCollapse.addEventListener('click', () => setBiomeListCollapsed(!biomesBody.hidden));

        function setBiomesPanel(open) {
            biomesPanel.hidden = !open;
            if (open) {
                setStructuresPanel(false); // the panels share one spot
                setStatsPanel(false);
                renderBiomeLegend();
            }
        }

        function setBiomeMode(on) {
            biomeMode = on;
            try { localStorage.setItem(BIOME_MODE_KEY, on ? '1' : '0'); } catch (e) { /* ignore */ }
            if (on && caveMode) {
                caveMode = false;
                try { localStorage.setItem(CAVE_MODE_KEY, '0'); } catch (e) { /* ignore */ }
                updateCaveUi();
            }
            biomesToggle.setAttribute('aria-pressed', String(on));
            if (!on) hideBiomeTip();
            setBiomesPanel(on);
            if (current && frame.getAttribute('src') !== mapPath(current)) reloadMap();
        }

        // Off -> biome map + legend; on with the legend hidden -> show legend; else off.
        function toggleBiomes() {
            if (!biomeDoc) return;
            if (!biomeMode) setBiomeMode(true);
            else if (biomesPanel.hidden) setBiomesPanel(true);
            else setBiomeMode(false);
        }

        biomesToggle.addEventListener('click', toggleBiomes);

        // `view` overrides the carried-over position (used to jump to a structure).
        function select(dim, { pushHistory = true, view = null } = {}) {
            if (!DIMENSIONS[dim]) dim = DEFAULT_DIM;
            if (dim === current) return;

            // Where to open the new dimension, in this order:
            // explicit jump > last position there this session > position
            // converted from the current map (Overworld <-> Nether is 1:8).
            pendingView = null;
            const from = current && DIMENSIONS[current];
            const to = DIMENSIONS[dim];
            const v = current ? readView() : null;
            if (v) rememberView(current, v);

            if (view) {
                pendingView = { ppb: v && v.ppb, ...view };
            } else if (savedViews[dim]) {
                pendingView = { ...savedViews[dim] };
            } else if (v && from.scale && to.scale) {
                const f = from.scale / to.scale;
                pendingView = { x: v.x * f, z: v.z * f, ppb: v.ppb };
            } else if (v) {
                pendingView = { x: 0, z: 0, ppb: v.ppb };
            }

            current = dim;
            measureReset(); // the measurement belongs to the map being unloaded
            structuresReset();
            hideBiomeTip();
            frame.src = mapPath(dim);
            buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dim === dim)));
            document.title = to.label; // the tab shows only the dimension

            if (pushHistory) {
                history.replaceState(null, '', '#' + dim);
            }
        }

        // ---- Distance measurement ----------------------------------------
        // Runs inside the uNmINeD map via its own OpenLayers instance: a vector
        // layer for the line plus a Draw interaction. Lengths are computed in
        // block coordinates (x/z), so they match in-game distances.

        const SPRINT_BLOCKS_PER_SECOND = 5.612;

        const measureToggle = document.getElementById('measure-toggle');
        const measurePanel = document.getElementById('measure');
        const measureTotal = document.getElementById('measure-total');
        const measureDetails = document.getElementById('measure-details');
        const measureHint = document.getElementById('measure-hint');
        const measureFinish = document.getElementById('measure-finish');
        const measureClear = document.getElementById('measure-clear');

        let measureActive = false;
        let measureDrawing = false;
        let measureCtx = null; // { ol, u, source, layer, draw } for the loaded map

        const fmtBlocks = n => Math.round(n).toLocaleString() + (Math.round(n) === 1 ? ' block' : ' blocks');

        function fmtDuration(seconds) {
            const s = Math.round(seconds);
            if (s < 60) return s + ' s';
            const pad = n => String(n).padStart(2, '0');
            if (s < 3600) return Math.floor(s / 60) + ':' + pad(s % 60) + ' min';
            return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ' h';
        }

        function toBlocks(ctx, coords) {
            return coords.map(c => ctx.ol.proj.transform(c, ctx.u.viewProjection, ctx.u.dataProjection));
        }

        function pathLength(pts) {
            let total = 0;
            for (let i = 1; i < pts.length; i++) {
                total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
            }
            return total;
        }

        function measureStyle(ctx) {
            const ol = ctx.ol;
            const outline = new ol.style.Style({
                stroke: new ol.style.Stroke({ color: 'rgba(0, 0, 0, 0.6)', width: 5 })
            });
            const line = new ol.style.Style({
                stroke: new ol.style.Stroke({ color: '#ffd166', width: 2.5, lineDash: [8, 6] })
            });
            const dot = new ol.style.Circle({
                radius: 4,
                fill: new ol.style.Fill({ color: '#ffd166' }),
                stroke: new ol.style.Stroke({ color: '#000', width: 1.5 })
            });
            const cursor = new ol.style.Style({ image: dot });

            return feature => {
                const geom = feature.getGeometry();
                const type = geom.getType();
                if (type === 'Point') return cursor;
                if (type !== 'LineString') return null;

                const coords = geom.getCoordinates();
                const length = pathLength(toBlocks(ctx, coords));
                return [
                    outline,
                    line,
                    new ol.style.Style({ geometry: new ol.geom.MultiPoint(coords), image: dot }),
                    new ol.style.Style({
                        geometry: new ol.geom.Point(coords[coords.length - 1]),
                        text: new ol.style.Text({
                            text: fmtBlocks(length),
                            font: 'bold 13px -apple-system, "Segoe UI", Roboto, sans-serif',
                            fill: new ol.style.Fill({ color: '#fff' }),
                            stroke: new ol.style.Stroke({ color: 'rgba(0, 0, 0, 0.85)', width: 3 }),
                            offsetY: -16
                        })
                    })
                ];
            };
        }

        function renderMeasure(pts) {
            measurePanel.hidden = !measureActive;
            if (!measureActive) return;

            const hasLine = !!(pts && pts.length >= 2);
            measureDetails.replaceChildren();

            if (hasLine) {
                const total = pathLength(pts);
                const first = pts[0];
                const last = pts[pts.length - 1];
                const dx = last[0] - first[0];
                const dz = last[1] - first[1];
                const rows = [];

                if (pts.length > 2) {
                    rows.push(['Straight line', fmtBlocks(Math.hypot(dx, dz))]);
                    rows.push(['Segments', String(pts.length - 1)]);
                }
                rows.push(['Δx', Math.abs(Math.round(dx)).toLocaleString() + (dx < 0 ? ' W' : ' E')]);
                rows.push(['Δz', Math.abs(Math.round(dz)).toLocaleString() + (dz < 0 ? ' N' : ' S')]);

                const scale = DIMENSIONS[current].scale;
                if (scale === 1) rows.push(['Via Nether', fmtBlocks(total / 8)]);
                if (scale === 8) rows.push(['In Overworld', fmtBlocks(total * 8)]);
                rows.push(['Sprinting', fmtDuration(total / SPRINT_BLOCKS_PER_SECOND)]);

                for (const [label, value] of rows) {
                    const dt = document.createElement('dt');
                    const dd = document.createElement('dd');
                    dt.textContent = label;
                    dd.textContent = value;
                    measureDetails.append(dt, dd);
                }
                measureTotal.textContent = fmtBlocks(total);
            } else {
                measureTotal.textContent = fmtBlocks(0);
            }

            if (!measureCtx) {
                measureHint.textContent = 'Waiting for the map…';
            } else if (measureDrawing) {
                measureHint.textContent = 'Click to add points · double-click to finish · Backspace removes the last point · Esc cancels';
            } else {
                measureHint.textContent = hasLine ? 'Click on the map to start a new measurement' : 'Click on the map to start measuring';
            }
            measureFinish.hidden = !measureDrawing;
            measureClear.hidden = !hasLine;
        }

        function measureAttach() {
            if (!measureActive || measureCtx) return;
            const u = getUnmined();
            const ol = frame.contentWindow && frame.contentWindow.ol;
            if (!u || !u.olMap || !ol) return;

            try {
                const ctx = { ol, u };
                const style = measureStyle(ctx);
                ctx.source = new ol.source.Vector();
                ctx.layer = new ol.layer.Vector({ source: ctx.source, style, zIndex: 2000 });
                ctx.draw = new ol.interaction.Draw({
                    source: ctx.source,
                    type: 'LineString',
                    style,
                    stopClick: true
                });

                ctx.draw.on('drawstart', e => {
                    ctx.source.clear();
                    measureDrawing = true;
                    const geom = e.feature.getGeometry();
                    geom.on('change', () => renderMeasure(toBlocks(ctx, geom.getCoordinates())));
                });
                ctx.draw.on('drawend', e => {
                    measureDrawing = false;
                    renderMeasure(toBlocks(ctx, e.feature.getGeometry().getCoordinates()));
                });
                ctx.draw.on('drawabort', () => {
                    measureDrawing = false;
                    renderMeasure(null);
                });

                u.olMap.addLayer(ctx.layer);
                u.olMap.addInteraction(ctx.draw);
                u.olMap.getTargetElement().style.cursor = 'crosshair';
                measureCtx = ctx;
            } catch (e) {
                console.warn('Measuring unavailable', e);
            }
        }

        function measureDetach() {
            if (measureCtx) {
                try {
                    const { u, layer, draw } = measureCtx;
                    u.olMap.removeInteraction(draw);
                    u.olMap.removeLayer(layer);
                    u.olMap.getTargetElement().style.cursor = '';
                } catch (e) { /* map already gone */ }
            }
            measureCtx = null;
            measureDrawing = false;
        }

        // Called when the map in the iframe is replaced.
        function measureReset() {
            measureCtx = null;
            measureDrawing = false;
            renderMeasure(null);
        }

        function setMeasure(on) {
            measureActive = on;
            if (on) hideInfo();
            measureToggle.setAttribute('aria-pressed', String(on));
            if (on) measureAttach(); else measureDetach();
            renderMeasure(null);
        }

        measureToggle.addEventListener('click', () => setMeasure(!measureActive));
        measureFinish.addEventListener('click', () => measureCtx && measureCtx.draw.finishDrawing());
        measureClear.addEventListener('click', () => {
            if (!measureCtx) return;
            measureCtx.draw.abortDrawing();
            measureCtx.source.clear();
            measureDrawing = false;
            renderMeasure(null);
        });

        // ---- Structures ------------------------------------------------
        // map/structures.json is written by tools/build_map.py (block scan of
        // the world). Shown as an extra vector layer inside the uNmINeD map.

        const STRUCTURE_TYPES = {
            nether_portal:  { icon: '🌀', color: '#9b59b6' },
            stronghold:     { icon: '👁️', color: '#16a085' },
            village:        { icon: '🔔', color: '#d4a017' },
            trial_chamber:  { icon: '🗝️', color: '#c2703d' },
            ancient_city:   { icon: '💀', color: '#3a86c8' },
            ocean_monument: { icon: '🔱', color: '#1fa2b5' },
            spawner:        { icon: '🔥', color: '#e67e22' },
            desert_pyramid: { icon: '🏜️', color: '#d9a441' },
            jungle_temple:  { icon: '🌴', color: '#3f9b3f' },
            swamp_hut:      { icon: '🧙', color: '#5b7f3a' },
            igloo:          { icon: '🧊', color: '#8fc9e0' },
            woodland_mansion: { icon: '🏚️', color: '#7a5230' },
            ruined_portal:  { icon: '🧱', color: '#7d3c98' },
            trail_ruins:    { icon: '🏺', color: '#b5651d' },
            ocean_ruins:    { icon: '🐚', color: '#2e86ab' },
            mineshaft:      { icon: '⛏️', color: '#8d6e63' },
            amethyst_geode: { icon: '💎', color: '#9b59b6' },
            fortress:       { icon: '🏰', color: '#b03a2e' },
            bastion:        { icon: '🪙', color: '#b8860b' },
            nether_fossil:  { icon: '🦴', color: '#cfc6ad' },
            end_gateway:    { icon: '✨', color: '#8e7cc3' },
            end_city:       { icon: '🏙️', color: '#c39bd3' },
            end_ship:       { icon: '🚢', color: '#a569bd' },
            exit_portal:    { icon: '🐉', color: '#6c3483' }
        };
        const DEFAULT_TYPE = { icon: '•', color: '#888888' };
        const LABEL_MIN_PIXELS_PER_BLOCK = 1; // show names from this zoom on
        const HIDDEN_KEY = 'map-renderer.hidden-structures';

        const structuresToggle = document.getElementById('structures-toggle');
        const structuresPanel = document.getElementById('structures');
        const structuresList = document.getElementById('structures-list');
        const structuresMeta = document.getElementById('structures-meta');
        const infoPanel = document.getElementById('info');

        let structureDoc = null;  // parsed structures.json, or { structures: [] }
        let structCtx = null;     // { ol, u, source, layer } for the loaded map
        let selectedId = null;
        let pendingSelectId = null;

        let hiddenTypes = new Set();
        try { hiddenTypes = new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY)) || []); } catch (e) { /* ignore */ }

        // Lookups by dimension and id, built once (structures.json can hold
        // tens of thousands of entries with --extras).
        const structuresByDim = new Map();
        const structuresById = new Map();

        const structuresLoaded = fetch('map/structures.json', { cache: 'no-cache' })
            .then(r => (r.ok ? r.json() : { structures: [] }))
            .catch(() => ({ structures: [] }))
            .then(doc => {
                structureDoc = doc;
                for (const s of doc.structures || []) {
                    if (!structuresByDim.has(s.dim)) structuresByDim.set(s.dim, []);
                    structuresByDim.get(s.dim).push(s);
                    structuresById.set(s.id, s);
                }
            });

        const typeInfo = type => STRUCTURE_TYPES[type] || DEFAULT_TYPE;
        const structuresIn = dim => structuresByDim.get(dim) || [];
        const findStructure = id => structuresById.get(id) || null;

        // Marker (colored ring + emoji) drawn once per type into a canvas.
        // Drawing a cached image is far cheaper than a circle plus an emoji
        // text for every structure. The canvas is created in the map's
        // document, which belongs to the iframe's OpenLayers.
        function markerImage(doc, type, selected) {
            const t = typeInfo(type);
            const ratio = Math.min(3, Math.max(1, Math.ceil(window.devicePixelRatio || 1)));
            const radius = selected ? 13 : 10;
            const line = selected ? 3 : 2;
            const size = 2 * (radius + line);
            const canvas = doc.createElement('canvas');
            canvas.width = canvas.height = size * ratio;
            const g = canvas.getContext('2d');
            g.scale(ratio, ratio);
            g.beginPath();
            g.arc(size / 2, size / 2, radius, 0, 2 * Math.PI);
            g.fillStyle = 'rgba(20, 20, 24, 0.85)';
            g.fill();
            g.lineWidth = line;
            g.strokeStyle = selected ? '#fff' : t.color;
            g.stroke();
            g.font = (selected ? 14 : 11) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
            g.textAlign = 'center';
            g.textBaseline = 'middle';
            g.fillStyle = '#fff';
            g.fillText(t.icon, size / 2, size / 2 + 1);
            return { canvas, ratio };
        }

        function structureStyle(ctx) {
            const ol = ctx.ol;
            const doc = ctx.u.olMap.getTargetElement().ownerDocument;
            const unit = blockUnit(ctx.u, ol);
            const icons = new Map();   // type[:sel] -> Style
            const labels = new Map();  // label text -> Style

            function icon(type, selected) {
                const key = type + (selected ? ':sel' : '');
                let style = icons.get(key);
                if (!style) {
                    const { canvas, ratio } = markerImage(doc, type, selected);
                    style = new ol.style.Style({
                        image: new ol.style.Icon({ img: canvas, scale: 1 / ratio }),
                        zIndex: selected ? 2 : 1
                    });
                    icons.set(key, style);
                }
                return style;
            }

            function label(text) {
                let style = labels.get(text);
                if (!style) {
                    style = new ol.style.Style({
                        text: new ol.style.Text({
                            text,
                            font: '600 12px -apple-system, "Segoe UI", Roboto, sans-serif',
                            fill: new ol.style.Fill({ color: '#fff' }),
                            stroke: new ol.style.Stroke({ color: 'rgba(0, 0, 0, 0.85)', width: 3 }),
                            offsetY: 22
                        }),
                        zIndex: 3
                    });
                    labels.set(text, style);
                }
                return style;
            }

            return (feature, resolution) => {
                const s = feature.get('structure');
                const selected = s.id === selectedId;
                if (hiddenTypes.has(s.type) && !selected) return null;
                if (unit / resolution >= LABEL_MIN_PIXELS_PER_BLOCK || selected) {
                    return [icon(s.type, selected), label(s.label)];
                }
                return icon(s.type, selected);
            };
        }

        function attachStructures() {
            if (structCtx || !structureDoc) return;
            const u = getUnmined();
            const ol = frame.contentWindow && frame.contentWindow.ol;
            if (!u || !u.olMap || !ol) return;

            try {
                const ctx = { ol, u };
                ctx.source = new ol.source.Vector({
                    features: structuresIn(current).map(s => {
                        const f = new ol.Feature({
                            geometry: new ol.geom.Point(ol.proj.transform([s.x + 0.5, s.z + 0.5], u.dataProjection, u.viewProjection))
                        });
                        f.set('structure', s);
                        return f;
                    })
                });
                // VectorImage draws all markers into one image and reuses it while
                // panning and zooming, instead of redrawing every marker each frame.
                ctx.layer = new ol.layer.VectorImage({
                    source: ctx.source,
                    style: structureStyle(ctx),
                    zIndex: 1500,
                    imageRatio: 1.5
                });
                u.olMap.addLayer(ctx.layer);

                const hit = pixel => u.olMap.forEachFeatureAtPixel(pixel, f => f.get('structure'),
                    { layerFilter: l => l === ctx.layer, hitTolerance: 4 });

                u.olMap.on('singleclick', e => {
                    if (measureActive) return;
                    const w = waypointAt(e.pixel); // waypoints are drawn on top
                    if (w) {
                        showWaypoint(w);
                        return;
                    }
                    const s = hit(e.pixel);
                    if (s) showInfo(s); else closeInfo();
                });

                // Hover cursor: at most one hit test per frame.
                let hoverPixel = null;
                const target = u.olMap.getTargetElement();
                const view = target.ownerDocument.defaultView;
                u.olMap.on('pointermove', e => {
                    if (measureActive || e.dragging) return;
                    if (hoverPixel === null) {
                        view.requestAnimationFrame(() => {
                            const over = !measureActive && (waypointAt(hoverPixel) || hit(hoverPixel));
                            target.style.cursor = over ? 'pointer' : '';
                            hoverPixel = null;
                        });
                    }
                    hoverPixel = e.pixel;
                });

                structCtx = ctx;
            } catch (e) {
                console.warn('Structures unavailable', e);
            }

            renderLegend();
            if (pendingSelectId) {
                const s = findStructure(pendingSelectId);
                pendingSelectId = null;
                if (s) showInfo(s);
            }
        }

        function structuresReset() {
            structCtx = null;
            selectedId = null;
            infoPanel.hidden = true;
        }

        function refreshStructures() {
            if (structCtx) structCtx.layer.changed();
            if (waypointCtx) waypointCtx.layer.setVisible(!hiddenTypes.has(WAYPOINT_TYPE));
        }

        function saveHiddenTypes() {
            try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenTypes])); } catch (e) { /* ignore */ }
        }

        // "Show all" / "Hide all" for the types of the current dimension.
        function updateAllButton(types) {
            const allButton = document.getElementById('structures-all');
            const allVisible = types.every(t => !hiddenTypes.has(t));
            allButton.hidden = types.length === 0;
            allButton.textContent = allVisible ? 'Hide all' : 'Show all';
            allButton.title = allVisible ? 'Hide all structure types' : 'Show all structure types';
            allButton.onclick = () => {
                for (const t of types) {
                    if (allVisible) hiddenTypes.add(t); else hiddenTypes.delete(t);
                }
                saveHiddenTypes();
