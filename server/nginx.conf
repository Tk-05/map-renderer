server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    gzip_min_length 1024;

    # map/ is a volume written by the renderer service; tiles change after each run.
    location /map/ {
        # Until a dimension has been rendered, show a notice instead of a 404.
        location ~ ^/map/[^/]+/index\.html$ {
            try_files $uri /map-pending.html;
        }
        location ~* \.(webp|png|jpg)$ {
            expires 1h;
            add_header Cache-Control "public";
            # Missing tiles at the world edge are normal; don't fill the log.
            log_not_found off;
        }
        # Biome lookup (hover info); requested with ?v=<render time>, already compressed.
        location ~* ^/map/biomedata/.*\.bin$ {
            expires 7d;
            add_header Cache-Control "public";
            log_not_found off;
        }
    }

    # Own waypoints (MARKERS_DIR): edited by hand, so always fetch the current file.
    location /markers/ {
        add_header Cache-Control "no-cache";
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
